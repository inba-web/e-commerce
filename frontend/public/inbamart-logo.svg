<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 42" width="180" height="42">
  <style>
    .brand-text {
      font-family: 'Outfit', 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 24px;
      letter-spacing: -0.8px;
    }
    .text-inba {
      font-weight: 900;
      fill: #00927c;
    }
    .text-mart {
      font-weight: 400;
      fill: #1f2937;
    }
    .swoosh {
      fill: none;
      stroke-width: 2.5;
      stroke-linecap: round;
    }
  </style>

  <defs>
    <!-- Teal Gradient for the emblem -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00c0a5" />
      <stop offset="100%" style="stop-color:#007966" />
    </linearGradient>
    <!-- Orange/Yellow Gradient for the swoosh -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffaa00" />
      <stop offset="100%" style="stop-color:#ff7700" />
    </linearGradient>
  </defs>

  <g transform="translate(4, 2)">
    <!-- Modern Emblem: Sleek shopping bag with satisfaction checkmark -->
    <path d="M 12 12 C 12 5, 22 5, 22 12" fill="none" stroke="url(#tealGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 6 12 L 28 12 L 25 32 C 25 34.5, 23 36.5, 20.5 36.5 L 13.5 36.5 C 11 36.5, 9 34.5, 9 32 Z" fill="url(#tealGrad)" />
    <!-- White satisfaction checkmark -->
    <path d="M 13 24 L 17 28 L 22 20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(38, 29)">
    <text class="brand-text">
      <tspan class="text-inba">Inba</tspan>
      <tspan class="text-mart">Mart</tspan>
    </text>
    <!-- Smooth curved smile swoosh under the logo text -->
    <path class="swoosh" d="M 6 4 C 28 9, 68 9, 82 4" stroke="url(#orangeGrad)" />
    <!-- Arrow tip -->
    <path d="M 80 1 L 84 4 L 79 7" fill="none" stroke="url(#orangeGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
